[project]
name = "city-of-agents"
version = "0.1.0"
description = "City of Agents simulation backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.27.0",
  "pydantic>=2.0.0",
  "openai>=1.0.0",
  "anthropic>=0.34.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.4.0",
]

[project.scripts]
serve = "uvicorn api.main:app --reload --port 8000"
