name: CI

on:
  push:
    branches:
      - main
      - feature/**
      - codex/**
  pull_request:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: openai
      OPENAI_API_KEY: test-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Lint
        run: uvx ruff check .

      - name: Compile check
        run: uv run python -m compileall -q .

      - name: Run tests
        run: uv run pytest -q

